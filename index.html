<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kindle Dashboard V8 (ES5)</title>
    <style>
        /* --- 基础样式 --- */
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Bookerly", "Songti SC", serif;
            margin: 0;
            padding: 5px;
            height: 98vh;
            overflow: hidden;
            /* 默认竖屏布局 */
            display: block; 
            text-align: center;
        }

        /* 旋转容器：用于包裹所有内容，实现横屏 */
        #container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.5s;
        }

        /* --- 1. 顶部 --- */
        .header {
            border-bottom: 3px solid #000;
            padding-bottom: 5px;
            width: 94%;
            margin-bottom: 8px;
        }
        #clock {
            font-size: 100px; /* 略微调小以兼容更多机型 */
            font-weight: 900;
            line-height: 0.9;
            margin: 2px 0;
            letter-spacing: -3px;
        }
        #date { font-size: 24px; font-weight: bold; margin-top: 0; }
        #lunar { font-size: 18px; margin-top: 5px; font-weight: normal; }

        /* --- 2. 中部 --- */
        .weather-container {
            width: 98%;
            margin-top: 5px;
            margin-bottom: 8px;
        }
        .location {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px dashed #000;
            display: inline-block;
            padding-bottom: 2px;
        }
        .forecast {
            display: flex; /* Flexbox在旧Kindle上支持较好，如果不行需改table */
            display: -webkit-flex; /* 兼容旧WebKit */
            justify-content: space-around;
            -webkit-justify-content: space-around;
        }
        .day {
            flex: 1; -webkit-flex: 1;
            padding: 0 1px;
        }
        .day-icon { font-size: 30px; line-height: 1.1; margin: 2px 0; }
        .day-temp { font-size: 16px; font-weight: bold; margin: 2px 0; }
        .day-detail { font-size: 12px; margin-top: 1px; }
        .day-desc { font-size: 14px; margin-top: 2px; }

        /* --- 3. 底部 --- */
        .quote-container {
            border-top: 2px solid #000;
            padding-top: 8px;
            width: 94%;
        }
        #quote-text { font-size: 18px; font-style: italic; font-weight: bold; margin-bottom: 5px; }
        #quote-source { font-size: 15px; text-align: right; margin-top: 2px; }

        /* --- 旋转控制按钮 --- */
        #rotate-btn {
            position: fixed;
            bottom: 5px;
            right: 5px;
            font-size: 20px;
            border: 1px solid #000;
            background: #fff;
            padding: 2px 5px;
            cursor: pointer;
            z-index: 999;
        }

        /* --- 横屏模式样式 (强制旋转) --- */
        body.landscape-mode #container {
            /* 旋转90度 */
            transform: rotate(90deg);
            -webkit-transform: rotate(90deg);
            /* 旋转后需要重新调整宽宽 */
            width: 98vh; 
            height: 98vw;
            /* 居中修正 */
            position: absolute;
            top: 50%;
            left: 50%;
            margin-left: -49vh; 
            margin-top: -49vw;
        }
    </style>
</head>
<body>

    <div id="rotate-btn" onclick="toggleRotate()">⟳</div>

    <div id="container">
        <div class="header">
            <div id="clock">--:--</div>
            <div id="date">Loading...</div>
            <div id="lunar">Loading...</div>
        </div>

        <div class="weather-container">
            <div class="location">📍 深圳·宝安·西乡</div>
            <div class="forecast" id="weather-box">
                Loading Weather...
            </div>
        </div>

        <div class="quote-container">
            <div id="quote-text">“...”</div>
            <div id="quote-source">—— 豆瓣</div>
        </div>
    </div>

    <script>
        // --- 兼容性配置 (ES5) ---
        var LAT = 22.57; 
        var LON = 113.86; 

        // 1. 时钟函数
        function updateClock() {
            var now = new Date();
            var hours = ('0' + now.getHours()).slice(-2);
            var minutes = ('0' + now.getMinutes()).slice(-2);
            var weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            var dateStr = (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + weekDays[now.getDay()];

            document.getElementById('clock').innerHTML = hours + ':' + minutes;
            document.getElementById('date').innerHTML = dateStr;
            
            // 离线黄历 (简单版)
            updateLunarSimple(now);
        }

        // 2. 离线黄历 (不依赖 Intl, 纯字符串处理)
        function updateLunarSimple(d) {
            // 由于老设备不支持Intl，我们使用一个极其简化的“宜”生成器
            // 真正的农历转换在老设备上非常庞大，这里为了不报错，
            // 如果设备不支持 Intl，则只显示“宜”
            var lunarText = "农历查询中";
            
            try {
                // 尝试检测 Intl
                if (window.Intl && window.Intl.DateTimeFormat) {
                     var formatter = new window.Intl.DateTimeFormat('zh-CN-u-ca-chinese', {day: 'numeric', month: 'long'});
                     lunarText = "农历" + formatter.format(d).replace(/[0-9]+年/, '');
                     // 简单替换数字
                     lunarText = lunarText.replace(/(\d+)(日)?/g, function(m, p1){ return getLunarName(p1); });
                }
            } catch(e) {}

            // 生成宜
            var seed = d.getFullYear() + d.getMonth() + d.getDate();
            var acts = ['阅读', '思考', '锻炼', '扫除', '听歌', '代码', '会友', '休息', '散步', '品茶', '整理', '观影'];
            var y1 = acts[seed % acts.length];
            var y2 = acts[(seed * 2) % acts.length];
            
            document.getElementById('lunar').innerHTML = lunarText + ' [宜] ' + y1 + ' ' + y2;
        }

        function getLunarName(n) {
            n = parseInt(n);
            var c = ['','一','二','三','四','五','六','七','八','九','十'];
            if(n<=10) return '初'+c[n];
            if(n<20) return '十'+c[n-10];
            if(n==20) return '二十';
            if(n==30) return '三十';
            if(n<30) return '廿'+c[n-20];
            return n;
        }

        // 3. 通用 Ajax 函数 (替代 fetch)
        function ajaxGet(url, successFn, failFn) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status >= 200 && xhr.status < 400) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            successFn(data);
                        } catch(e) { if(failFn) failFn(); }
                    } else {
                        if(failFn) failFn();
                    }
                }
            };
            xhr.onerror = failFn;
            xhr.send();
        }

        // 4. 天气功能
        function fetchWeather() {
            var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON + '&daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,relative_humidity_2m_mean&timezone=Asia%2FShanghai&forecast_days=4';
            
            ajaxGet(url, function(data) {
                var html = '';
                var days = ['今天', '明天', '后天', '大后天'];
                
                for(var i=0; i<4; i++) {
                    var max = Math.round(data.daily.temperature_2m_max[i]);
                    var min = Math.round(data.daily.temperature_2m_min[i]);
                    var code = data.daily.weather_code[i];
                    var hum = data.daily.relative_humidity_2m_mean[i];
                    var wind = data.daily.wind_speed_10m_max[i];
                    
                    // 风力计算
                    var windLvl = '0';
                    if(wind>=1) windLvl='1'; if(wind>=6) windLvl='2'; if(wind>=12) windLvl='3';
                    if(wind>=20) windLvl='4'; if(wind>=29) windLvl='5'; if(wind>=39) windLvl='6';
                    
                    html += '<div class="day">' +
                            '<div class="day-name">' + days[i] + '</div>' +
                            '<div class="day-icon">' + getWeatherEmoji(code) + '</div>' +
                            '<div class="day-temp">🌡️' + min + '-' + max + '°</div>' +
                            '<div class="day-detail">💧' + hum + '% 🌬️' + windLvl + '级</div>' +
                            '<div class="day-desc">' + wmoToText(code) + '</div>' +
                            '</div>';
                }
                document.getElementById('weather-box').innerHTML = html;
            }, function() {
                document.getElementById('weather-box').innerHTML = '天气更新失败';
            });
        }

        function getWeatherEmoji(code) {
            if(code===0) return '☀️'; 
            if(code===1||code===2||code===3) return '☁️';
            if(code>=51 && code<=67) return '🌧️';
            if(code>=95) return '⛈️';
            return '⛅'; // 默认
        }
        
        function wmoToText(code) {
            if(code===0) return '晴';
            if(code===1) return '多云';
            if(code===2) return '阴';
            if(code===3) return '阴';
            if(code>=51) return '雨';
            return '多云';
        }

        // 5. 台词功能
        function fetchQuote() {
            // 使用 XMLHttpRequest
            ajaxGet('https://v1.hitokoto.cn/?c=h&c=d', function(data) {
                var content = data.hitokoto;
                if(content.length > 25) content = content.substring(0, 24) + '...';
                document.getElementById('quote-text').innerHTML = '“' + content + '”';
                document.getElementById('quote-source').innerHTML = '—— 《' + data.from + '》';
            }, function() {
                document.getElementById('quote-text').innerHTML = '“生活不是电影。”';
            });
        }

        // 6. 横屏切换功能
        function toggleRotate() {
            var body = document.body;
            if(body.className.indexOf('landscape-mode') > -1) {
                body.className = '';
            } else {
                body.className = 'landscape-mode';
            }
        }

        // 初始化
        updateClock();
        fetchWeather();
        fetchQuote();

        // 定时器
        setInterval(updateClock, 60000); 
        setInterval(function(){ fetchWeather(); fetchQuote(); }, 1200000);

    </script>
</body>
</html>
