<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800, user-scalable=no">
    <title>Kindle Dashboard V11 (Clean)</title>
    <style>
        /* --- 基础样式 --- */
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Bookerly", "Songti SC", serif;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            text-align: center;
        }

        /* 旋转总容器 */
        #container {
            width: 800px;
            height: 600px;
            margin: 0 auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -300px;
            margin-left: -400px;
            background: #fff;
            transition: transform 0.5s;
        }

        /* --- 1. 顶部区域 (已精简) --- */
        .header-wrap {
            width: 96%;
            margin: 20px auto 10px auto; /* 增加顶部留白，更美观 */
            border-bottom: 3px solid #000;
            padding-bottom: 10px;
        }
        #clock {
            font-size: 120px; /* 字体加大，填充空间 */
            font-weight: 900;
            line-height: 1.0;
            letter-spacing: -5px;
            margin-bottom: 5px;
        }
        #date-line { font-size: 24px; font-weight: bold; margin-top: 5px; }
        
        /* --- 2. 中部天气 (Table布局) --- */
        .weather-wrap {
            width: 98%;
            margin: 20px auto;
        }
        .location-bar {
            font-size: 16px; font-weight: bold;
            border-bottom: 1px dashed #000;
            display: inline-block;
            margin-bottom: 10px; padding-bottom: 2px;
        }
        
        #weather-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .day-cell {
            text-align: center;
            vertical-align: top;
            padding: 0 2px;
            border-right: 1px dotted #aaa;
        }
        .day-cell:last-child { border-right: none; }

        .d-name { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .d-icon { font-size: 40px; line-height: 1.2; margin: 5px 0; font-family: serif; } /* 图标稍微加大 */
        .d-temp { font-size: 16px; font-weight: bold; margin: 4px 0; }
        .d-det { font-size: 13px; margin: 4px 0; white-space: nowrap; }
        .d-desc { font-size: 15px; margin-top: 5px; font-weight: bold;}

        /* --- 3. 底部台词 --- */
        .footer-wrap {
            width: 96%;
            margin: 10px auto;
            border-top: 2px solid #000;
            padding-top: 15px;
        }
        #quote-text { font-size: 19px; font-style: italic; font-weight: bold; line-height: 1.3; }
        #quote-source { font-size: 16px; text-align: right; margin-top: 5px; }

        /* --- 旋转按钮 --- */
        #rotate-btn {
            position: fixed; bottom: 10px; right: 10px;
            font-size: 24px; border: 2px solid #000;
            background: #fff; padding: 4px 8px; border-radius: 4px;
            cursor: pointer; z-index: 999;
        }

        /* 强制横屏模式 */
        body.landscape-mode #container {
            transform: rotate(90deg);
            -webkit-transform: rotate(90deg);
            width: 600px; 
            height: 800px;
            margin-top: -400px;
            margin-left: -300px;
        }
    </style>
</head>
<body>

    <div id="rotate-btn" onclick="toggleRotate()">⟳ 切屏</div>

    <div id="container">
        <div class="header-wrap">
            <div id="clock">--:--</div>
            <div id="date-line">
                <span id="date">Loading...</span>
            </div>
        </div>

        <div class="weather-wrap">
            <div class="location-bar">📍 深圳·宝安·西乡</div>
            <table id="weather-table">
                <tr id="weather-row">
                    <td>Loading Weather...</td>
                </tr>
            </table>
        </div>

        <div class="footer-wrap">
            <div id="quote-text">“...”</div>
            <div id="quote-source">—— 豆瓣</div>
        </div>
    </div>

    <script>
        // ================= ES5 兼容代码 =================
        var LAT = 22.57; 
        var LON = 113.86; 

        // 1. Ajax
        function ajaxGet(url, successFn, failFn) {
            var xhr = new XMLHttpRequest();
            var tUrl = url + (url.indexOf('?') > -1 ? '&' : '?') + '_t=' + new Date().getTime();
            xhr.open('GET', tUrl, true);
            xhr.timeout = 15000; 
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status >= 200 && xhr.status < 400) {
                        try { var data = JSON.parse(xhr.responseText); successFn(data); } 
                        catch(e) { if(failFn) failFn(); }
                    } else { if(failFn) failFn(); }
                }
            };
            xhr.onerror = function() { if(failFn) failFn(); };
            xhr.ontimeout = function() { if(failFn) failFn(); };
            xhr.send();
        }

        // 2. 时钟 (仅公历)
        function updateClock() {
            var now = new Date();
            var utcHours = now.getUTCHours();
            var hours = ('0' + ((utcHours + 8) % 24)).slice(-2);
            var minutes = ('0' + now.getMinutes()).slice(-2);
            var weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            document.getElementById('clock').innerHTML = hours + ':' + minutes;
            document.getElementById('date').innerHTML = (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + weekDays[now.getDay()];
        }

        // 3. 天气系统 (安全图标 + 文字标签)
        function getSafeIcon(code) {
            if(code === 0) return '☀'; 
            if(code > 0 && code <= 3) return '☁'; 
            if(code === 45 || code === 48) return '🌫';
            if(code >= 51 && code <= 67) return '☔';
            if(code >= 71 && code <= 86) return '❄';
            if(code >= 95) return '⚡';
            return '☔'; 
        }

        function fetchWeather() {
            var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON + '&daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,relative_humidity_2m_mean&timezone=Asia%2FShanghai&forecast_days=4';
            
            ajaxGet(url, function(data) {
                var htmlStr = '';
                var daysStr = ['今天', '明天', '后天', '大后天'];
                
                for(var i=0; i<4; i++) {
                    var d = data.daily;
                    var max = Math.round(d.temperature_2m_max[i]);
                    var min = Math.round(d.temperature_2m_min[i]);
                    var hum = d.relative_humidity_2m_mean[i];
                    var windKm = d.wind_speed_10m_max[i];
                    var windLvl = '0';
                    if(windKm>=1) windLvl='1'; if(windKm>=6) windLvl='2'; if(windKm>=12) windLvl='3';
                    if(windKm>=20) windLvl='4'; if(windKm>=29) windLvl='5'; if(windKm>=39) windLvl='6';
                    
                    htmlStr += '<td class="day-cell">' +
                               '<div class="d-name">' + daysStr[i] + '</div>' +
                               '<div class="d-icon">' + getSafeIcon(d.weather_code[i]) + '</div>' +
                               '<div class="d-temp">温度 ' + min + '-' + max + '°</div>' +
                               '<div class="d-det">湿度' + hum + '% 风力' + windLvl + '级</div>' +
                               '</td>';
                }
                document.getElementById('weather-row').innerHTML = htmlStr;
            }, function() {
                document.getElementById('weather-row').innerHTML = '<td>天气更新失败</td>';
            });
        }

        // 4. 台词系统
        function fetchQuote() {
            ajaxGet('https://v1.hitokoto.cn/?c=h&c=d', function(data) {
                var txt = data.hitokoto;
                if(txt.length > 35) txt = txt.substring(0, 33) + '...';
                document.getElementById('quote-text').innerHTML = '“' + txt + '”';
                document.getElementById('quote-source').innerHTML = '—— ' + (data.from_who || '') + '《' + data.from + '》';
            }, function() {
                document.getElementById('quote-text').innerHTML = '“生活不是电影，生活比电影苦。”';
                document.getElementById('quote-source').innerHTML = '—— 《天堂电影院》';
            });
        }

        // 5. 切屏逻辑
        function toggleRotate() {
            var b = document.body;
            if(b.className.indexOf('landscape-mode') > -1) { b.className = ''; } 
            else { b.className = 'landscape-mode'; }
        }

        // 启动
        updateClock(); 
        fetchWeather(); 
        fetchQuote();

        // 定时
        setInterval(updateClock, 60000);
        setInterval(function(){ fetchWeather(); fetchQuote(); }, 1800000); 

    </script>
</body>
</html>
