<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kindle Dashboard V7</title>
    <style>
        /* Kindle 墨水屏优化样式 - V7 修正版 */
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Bookerly", "Songti SC", serif;
            margin: 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            height: 98vh;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- 1. 顶部：时间 & 黄历 --- */
        .header {
            text-align: center;
            border-bottom: 3px solid #000;
            padding-bottom: 5px;
            width: 94%;
            margin-bottom: 8px;
        }
        #clock {
            font-size: 120px;
            font-weight: 900;
            line-height: 0.9;
            margin: 2px 0;
            letter-spacing: -4px;
        }
        #date {
            font-size: 24px;
            font-weight: bold;
            margin-top: 0px;
        }
        #lunar {
            font-size: 18px;
            margin-top: 5px;
            font-weight: normal;
            white-space: nowrap;
        }

        /* --- 2. 中部：天气 --- */
        .weather-container {
            width: 98%;
            margin-top: 5px;
            margin-bottom: 8px;
        }
        .location {
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
            border-bottom: 1px dashed #000;
            display: inline-block;
            padding-bottom: 2px;
            position: relative;
            left: 50%;
            transform: translateX(-50%);
        }
        .forecast {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .day {
            flex: 1;
            padding: 0 1px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .day-name { font-size: 16px; font-weight: bold; margin-bottom: 2px;}
        .day-icon { font-size: 32px; line-height: 1.1; margin: 2px 0; }
        
        .day-temp { 
            font-size: 16px; 
            font-weight: bold; 
            margin: 2px 0; 
            white-space: nowrap;
        }
        
        .day-detail {
            font-size: 14px;
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 1px;
            white-space: nowrap;
        }
        .day-desc { font-size: 14px; margin-top: 2px;}

        /* --- 3. 底部：台词 --- */
        .quote-container {
            border-top: 2px solid #000;
            padding-top: 8px;
            text-align: center;
            width: 94%;
        }
        #quote-text {
            font-size: 18px;
            font-style: italic;
            font-weight: bold;
            margin-bottom: 5px;
            line-height: 1.2;
        }
        #quote-source {
            font-size: 15px;
            text-align: right;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div id="clock">--:--</div>
        <div id="date">Loading...</div>
        <div id="lunar">Loading...</div>
    </div>

    <div class="weather-container">
        <div class="location">📍 深圳·宝安·西乡</div>
        <div class="forecast" id="weather-box">
            Loading Weather...
        </div>
    </div>

    <div class="quote-container">
        <div id="quote-text">“...”</div>
        <div id="quote-source">—— 豆瓣</div>
    </div>

    <script>
        // --- 配置区 ---
        const LAT = 22.57; 
        const LON = 113.86; 

        // --- 1. 时钟 ---
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const dateStr = `${now.getMonth() + 1}月${now.getDate()}日 ${weekDays[now.getDay()]}`;

            document.getElementById('clock').innerText = `${hours}:${minutes}`;
            document.getElementById('date').innerText = dateStr;
            
            updateLunarOffline(now);
        }

        // --- 2. 离线黄历 (V7 修复版: 强制数字转汉字) ---
        
        // 辅助函数：将数字天转换为农历叫法 (4 -> 初四, 15 -> 十五, 23 -> 廿三)
        function getLunarDayName(num) {
            const n = parseInt(num);
            const digits = ['','一','二','三','四','五','六','七','八','九','十'];
            if (n <= 10) return '初' + digits[n];
            if (n === 20) return '二十';
            if (n === 30) return '三十';
            if (n < 20) return '十' + digits[n - 10];
            if (n < 30) return '廿' + digits[n - 20];
            return n; // 兜底
        }

        function updateLunarOffline(dateObj) {
            try {
                // 使用 Intl 获取基础农历字符串
                const options = { calendar: 'chinese', day: 'numeric', month: 'long' };
                let lunarStr = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', options).format(dateObj);
                
                // 1. 去掉年份 (如 "2025年")
                lunarStr = lunarStr.replace(/[0-9]+年/, ''); 
                
                // 2. 关键修复：检测并替换未转化的数字日
                // 正则寻找“月”后面的数字，或者直接结尾的数字
                // 例如：Kindle可能返回 "十月4日" 或 "十月4"
                lunarStr = lunarStr.replace(/(\d+)(日)?/g, function(match, p1) {
                    return getLunarDayName(p1);
                });
                
                // 离线生成“宜” (伪随机)
                const seed = dateObj.getFullYear() + dateObj.getMonth() + dateObj.getDate();
                const activities = ['阅读', '思考', '锻炼', '扫除', '听歌', '代码', '会友', '休息', '散步', '品茶', '整理', '观影'];
                let idx1 = seed % activities.length;
                let idx2 = (seed * 2) % activities.length;
                let idx3 = (seed * 3) % activities.length;
                if(idx2 === idx1) idx2 = (idx2 + 1) % activities.length;
                if(idx3 === idx1 || idx3 === idx2) idx3 = (idx3 + 1) % activities.length;
                
                const yi = `${activities[idx1]} ${activities[idx2]} ${activities[idx3]}`;
                
                document.getElementById('lunar').innerText = `农历${lunarStr} [宜] ${yi}`;
            } catch (e) {
                document.getElementById('lunar').innerText = "农历显示需更新固件";
            }
        }

        // --- 3. 天气 (保持 V6 的全功能) ---
        function speedToLevel(kmh) {
            if (kmh < 1) return '0';
            if (kmh < 6) return '1';
            if (kmh < 12) return '2';
            if (kmh < 20) return '3';
            if (kmh < 29) return '4';
            if (kmh < 39) return '5';
            if (kmh < 50) return '6';
            if (kmh < 62) return '7';
            return '8+';
        }

        function getWeatherEmoji(code) {
            const map = {
                0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
                45: '🌫️', 48: '🌫️', 51: '🌧️', 53: '🌧️', 55: '🌧️',
                61: '🌧️', 63: '🌧️', 65: '🌧️', 80: '🌦️', 81: '🌦️',
                95: '⛈️', 96: '⛈️', 99: '⛈️'
            };
            return map[code] || '❓';
        }

        function wmoToText(code) {
            const map = {
                0: '晴', 1: '多云', 2: '阴', 3: '阴',
                45: '雾', 48: '雾', 51: '小雨', 53: '中雨', 55: '大雨',
                61: '小雨', 63: '中雨', 65: '大雨', 80: '阵雨', 81: '阵雨',
                95: '雷雨', 96: '雷雨', 99: '雷雨'
            };
            return map[code] || '未知';
        }

        async function fetchWeather() {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,relative_humidity_2m_mean&timezone=Asia%2FShanghai&forecast_days=4`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                let html = '';
                const days = ['今天', '明天', '后天', '大后天'];

                for(let i=0; i<4; i++) {
                    const max = Math.round(data.daily.temperature_2m_max[i]);
                    const min = Math.round(data.daily.temperature_2m_min[i]);
                    const code = data.daily.weather_code[i];
                    
                    const hum = data.daily.relative_humidity_2m_mean[i]; 
                    const windSpeed = data.daily.wind_speed_10m_max[i];
                    const windLevel = speedToLevel(windSpeed);
                    
                    html += `
                        <div class="day">
                            <div class="day-name">${days[i]}</div>
                            <div class="day-icon">${getWeatherEmoji(code)}</div>
                            <div class="day-temp">🌡️ ${min}-${max}度</div>
                            <div class="day-detail">
                                <span>💧${hum}%</span>
                                <span>🌬️${windLevel}级</span>
                            </div>
                            <div class="day-desc">${wmoToText(code)}</div>
                        </div>
                    `;
                }
                document.getElementById('weather-box').innerHTML = html;
            } catch (e) {
                document.getElementById('weather-box').innerText = "天气加载失败";
            }
        }

        // --- 4. 台词 ---
        async function fetchQuote() {
            try {
                const res = await fetch('https://v1.hitokoto.cn/?c=h&c=d');
                const data = await res.json();
                let content = data.hitokoto;
                if (content.length > 30) content = content.substring(0, 28) + "...";
                
                document.getElementById('quote-text').innerText = `“${content}”`;
                document.getElementById('quote-source').innerText = `—— 《${data.from}》`;
            } catch (e) {
                document.getElementById('quote-text').innerText = "“生活不是电影，生活比电影苦。”";
                document.getElementById('quote-source').innerText = "—— 《天堂电影院》";
            }
        }

        // --- 初始化 ---
        function init() {
            updateClock(); 
            fetchWeather();
            fetchQuote();

            setInterval(updateClock, 60000); 
            setInterval(() => {
                fetchWeather();
                fetchQuote();
            }, 1200000); 
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
